name: CI 
 
on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]
 
jobs:
  build-and-test:
    runs-on: ubuntu-latest
 
    steps:
      - uses: actions/checkout@v4
 
      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
 
      - name: Instalar dependencias
        run: npm ci
 
      - name: Ejecutar lint
        run: npm run lint
 
      - name: Compilar (build)
        run: npm run build
 